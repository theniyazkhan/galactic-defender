<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Galactic Defender - Space Survival</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #04050d;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: relative;
      border: 2px solid #1a2a4a;
      border-radius: 8px;
      box-shadow: 0 0 35px rgba(0, 200, 255, 0.25);
      background: #03040c;
      max-width: 100vw;
      max-height: 78vh;
    }
    canvas {
      display: block;
      background: #02030a;
      border-radius: 6px;
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }
    .hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 42px;
      background: rgba(4, 7, 20, 0.85);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-weight: bold;
      letter-spacing: 1px;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      border-bottom: 1px solid rgba(0, 200, 255, 0.2);
      font-size: 14px;
      z-index: 10;
    }
    .hud-left { display: flex; align-items: center; gap: 14px; }
    .score-txt { color: #4ef0ff; }
    .lives-txt { color: #ff3366; display: flex; align-items: center; gap: 4px; }
    .power-badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      background: #ffaa00;
      color: #000;
      font-weight: 800;
      display: none;
      animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.7; } to { opacity: 1.0; } }
    .hull-wrap { display: flex; align-items: center; gap: 6px; }
    .hull-bar-bg {
      width: 80px;
      height: 12px;
      background: #1a1a24;
      border: 1px solid #555;
      border-radius: 3px;
      overflow: hidden;
    }
    .hull-bar-fill {
      width: 100%;
      height: 100%;
      background: #00ff66;
      transition: width 0.1s;
    }
    .hull-val { font-size: 13px; color: #00ff66; min-width: 38px; }

    /* On-Screen Touch Controls for Mobile */
    #mobile-controls {
      display: flex;
      width: 100%;
      max-width: 800px;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      margin-top: 6px;
      z-index: 20;
    }
    .dpad {
      display: flex;
      gap: 14px;
    }
    .action-group {
      display: flex;
      gap: 12px;
    }
    .touch-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: rgba(15, 30, 60, 0.75);
      border: 2px solid #00c8ff;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 200, 255, 0.35);
      cursor: pointer;
      touch-action: none;
      transition: background 0.1s, transform 0.05s;
    }
    .touch-btn:active, .touch-btn.pressed {
      background: rgba(0, 200, 255, 0.5);
      transform: scale(0.92);
    }
    .btn-fire {
      width: 75px;
      height: 75px;
      background: rgba(180, 30, 30, 0.8);
      border-color: #ff3344;
      box-shadow: 0 0 18px rgba(255, 50, 70, 0.45);
      font-size: 15px;
      letter-spacing: 1px;
    }
    .btn-fire:active, .btn-fire.pressed {
      background: rgba(255, 50, 70, 0.7);
    }
    #instructions {
      text-align: center;
      color: #6a7d9b;
      font-size: 13px;
      margin-top: 4px;
    }
    #instructions kbd {
      background: #141b2d;
      border: 1px solid #2b395b;
      padding: 1px 6px;
      border-radius: 4px;
      color: #4ef0ff;
    }
    @media (min-width: 900px) {
      /* Show touch buttons slightly more compact on desktop or keep available for hybrid screens */
      .touch-btn { width: 56px; height: 56px; font-size: 20px; }
      .btn-fire { width: 66px; height: 66px; font-size: 14px; }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="hud-left">
        <div class="score-txt" id="hud-score">SCORE 0</div>
        <div class="lives-txt" id="hud-lives">🚀 &times; 3</div>
        <div class="power-badge" id="hud-power">BURST FIRE</div>
      </div>
      <div class="hull-wrap">
        <span>HULL</span>
        <div class="hull-bar-bg">
          <div class="hull-bar-fill" id="hud-fill"></div>
        </div>
        <div class="hull-val" id="hud-hp">100%</div>
      </div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>

  <!-- Mobile On-Screen Virtual Controls -->
  <div id="mobile-controls">
    <div class="dpad">
      <div class="touch-btn" id="btn-left">◀</div>
      <div class="touch-btn" id="btn-right">▶</div>
    </div>
    <div class="action-group">
      <div class="touch-btn btn-fire" id="btn-fire">FIRE</div>
    </div>
  </div>

  <div id="instructions">
    Desktop: <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> &bull; Fire: <kbd>SPACE</kbd> / <kbd>↑</kbd> &bull; Restart: <kbd>R</kbd> | Mobile: Use buttons or Drag on screen
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// Web Audio API Sound Effects
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playLaser(pitch = 880) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.11);
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.11);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.11);
}

function playExplosion(large = false) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(large ? 180 : 130, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + (large ? 0.4 : 0.22));
  gain.gain.setValueAtTime(large ? 0.28 : 0.16, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (large ? 0.4 : 0.22));
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + (large ? 0.4 : 0.22));
}

function playPowerup() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(440, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.25);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.25);
}

// Game State
let score = 0;
let health = 100;
let lives = 3;
let gameOver = false;
let gameTime = 0;
let shootTimer = 0;
let spawnTimer = 0;
let invulnerableTimer = 0; // respawn shield

// Powerup States:
// - burstTimer: triple-spread blaster / rapid burst
// - wingmanTimer: 2 satellite support companion drones
let burstTimer = 0;
let wingmanTimer = 0;

const MAX_HEALTH = 100;

// Player Ship
const ship = {
  x: W / 2,
  y: 60,
  halfW: 22,
  halfH: 26,
  speed: 6.8,
  moveLeft: false,
  moveRight: false,
  holdFire: false
};

// Entities pools
const stars = [];
for (let i = 0; i < 150; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    b: 0.2 + Math.random() * 0.8,
    speed: 0.4 + Math.random() * 1.3
  });
}

const bullets = [];
const asteroids = [];
const particles = [];
const drops = []; // power-up drop items (Repair, Burst Blaster, Wingmen)

function spawnBullet(x, y, vx = 0, vy = 15, color = '#ffff00') {
  bullets.push({ x, y, vx, vy, color });
}

function fireWeapons() {
  const cx = ship.x;
  const cy = ship.y + ship.halfH;

  if (burstTimer > 0) {
    // 💥 BURST / TRIPLE SPREAD SHOT
    spawnBullet(cx, cy, 0, 16, '#ff44aa');
    spawnBullet(cx - 10, cy - 6, -3.2, 15, '#ff44aa');
    spawnBullet(cx + 10, cy - 6, 3.2, 15, '#ff44aa');
    playLaser(1100);
  } else {
    // Standard twin blasters
    spawnBullet(cx - 12, cy, 0, 14, '#ffff00');
    spawnBullet(cx + 12, cy, 0, 14, '#ffff00');
    playLaser(880);
  }

  // If wingman drones active, they fire complementary beams
  if (wingmanTimer > 0) {
    spawnBullet(cx - 44, cy - 10, 0, 14, '#00e5ff');
    spawnBullet(cx + 44, cy - 10, 0, 14, '#00e5ff');
  }
}

function spawnAsteroid(speedMult) {
  const h = 14 + Math.random() * 20;
  asteroids.push({
    x: h + Math.random() * (W - 2 * h),
    y: H + h,
    half: h,
    vy: (1.6 + Math.random() * 2.2) * speedMult,
    seed: Math.random()
  });
}

// Powerup Rewards Types:
// 'repair'   : restores 40 HP
// 'burst'    : 10s triple burst spread fire
// 'wingman'  : 15s twin companion combat planes
// 'life'     : +1 extra life
function spawnDrop(x, y) {
  const roll = Math.random();
  let type = 'repair';
  if (roll < 0.35) type = 'burst';
  else if (roll < 0.65) type = 'wingman';
  else if (roll < 0.85) type = 'repair';
  else type = 'life';

  drops.push({ x, y, vy: 2.2, type, pulse: 0 });
}

function spawnExplosion(x, y, count = 18, color = '#ff7722') {
  playExplosion(count > 30);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 1.0 + Math.random() * 4.8;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1.0,
      color
    });
  }
}

// Keyboard controls
window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') ship.moveLeft = true;
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') ship.moveRight = true;
  if (e.code === 'Space' || e.key === 'ArrowUp') {
    if (!gameOver && shootTimer >= (burstTimer > 0 ? 0.14 : 0.22)) {
      fireWeapons();
      shootTimer = 0;
    }
    ship.holdFire = true;
  }
  if (e.key === 'r' || e.key === 'R') {
    if (gameOver) resetGame();
  }
});

window.addEventListener('keyup', e => {
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') ship.moveLeft = false;
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') ship.moveRight = false;
  if (e.code === 'Space' || e.key === 'ArrowUp') ship.holdFire = false;
});

// Touch / Mobile D-Pad Events
function bindTouch(id, onStart, onEnd) {
  const el = document.getElementById(id);
  const start = (e) => { e.preventDefault(); el.classList.add('pressed'); onStart(); };
  const end = (e) => { e.preventDefault(); el.classList.remove('pressed'); onEnd(); };
  el.addEventListener('touchstart', start, { passive: false });
  el.addEventListener('touchend', end, { passive: false });
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
}

bindTouch('btn-left', () => { ship.moveLeft = true; }, () => { ship.moveLeft = false; });
bindTouch('btn-right', () => { ship.moveRight = true; }, () => { ship.moveRight = false; });
bindTouch('btn-fire', () => {
  if (gameOver) {
    resetGame();
    return;
  }
  ship.holdFire = true;
  if (shootTimer >= (burstTimer > 0 ? 0.14 : 0.22)) {
    fireWeapons();
    shootTimer = 0;
  }
}, () => {
  ship.holdFire = false;
});

// Canvas direct touch drag support (slide your finger anywhere to steer & tap to shoot!)
let touchActive = false;
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  touchActive = true;
  const rect = canvas.getBoundingClientRect();
  const tx = (e.touches[0].clientX - rect.left) * (W / rect.width);
  ship.x = Math.max(ship.halfW + 10, Math.min(W - ship.halfW - 10, tx));
  ship.holdFire = true;
  if (gameOver) resetGame();
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!touchActive) return;
  const rect = canvas.getBoundingClientRect();
  const tx = (e.touches[0].clientX - rect.left) * (W / rect.width);
  ship.x = Math.max(ship.halfW + 10, Math.min(W - ship.halfW - 10, tx));
}, { passive: false });

canvas.addEventListener('touchend', () => {
  touchActive = false;
  ship.holdFire = false;
});

canvas.addEventListener('click', () => {
  if (gameOver) resetGame();
});

function resetGame() {
  score = 0;
  health = MAX_HEALTH;
  lives = 3;
  gameOver = false;
  gameTime = 0;
  shootTimer = 0;
  spawnTimer = 0;
  burstTimer = 0;
  wingmanTimer = 0;
  invulnerableTimer = 0;
  bullets.length = 0;
  asteroids.length = 0;
  particles.length = 0;
  drops.length = 0;
  ship.x = W / 2;
}

function handleShipHit() {
  if (invulnerableTimer > 0) return; // currently invulnerable

  health -= 25;
  spawnExplosion(ship.x, ship.y, 22, '#ff3300');

  if (health <= 0) {
    lives--;
    if (lives > 0) {
      // Continue playing! Respawn ship with temporary shield
      health = MAX_HEALTH;
      invulnerableTimer = 3.0; // 3 seconds shield
      ship.x = W / 2;
      playExplosion(true);
    } else {
      triggerGameOver();
    }
  }
}

function triggerGameOver() {
  health = 0;
  lives = 0;
  gameOver = true;
  spawnExplosion(ship.x, ship.y, 60, '#ff1100');
}

function diffMult() {
  const d = 1.0 + (gameTime / 120.0) * 1.5;
  return d > 2.5 ? 2.5 : d;
}

function spawnInterval() {
  const iv = 1.2 / diffMult();
  return iv < 0.4 ? 0.4 : iv;
}

// Main Game Loop
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

function update(dt) {
  // Stars
  for (const s of stars) {
    s.y -= s.speed;
    if (s.y < 0) { s.y = H; s.x = Math.random() * W; }
  }

  if (gameOver) {
    updateParticles();
    return;
  }

  gameTime += dt;
  shootTimer += dt;
  spawnTimer += dt;
  if (invulnerableTimer > 0) invulnerableTimer -= dt;
  if (burstTimer > 0) burstTimer -= dt;
  if (wingmanTimer > 0) wingmanTimer -= dt;

  // Player Steering
  if (ship.moveLeft && ship.x - ship.halfW > 10) ship.x -= ship.speed;
  if (ship.moveRight && ship.x + ship.halfW < W - 10) ship.x += ship.speed;

  // Auto fire
  const fireRate = burstTimer > 0 ? 0.13 : 0.22;
  if (ship.holdFire && shootTimer >= fireRate) {
    fireWeapons();
    shootTimer = 0;
  }

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.y > H + 20 || b.x < -20 || b.x > W + 20) bullets.splice(i, 1);
  }

  // Asteroid spawn
  if (spawnTimer >= spawnInterval()) {
    spawnAsteroid(diffMult());
    spawnTimer = 0;
  }

  // Drops kinematics & catching
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.y -= d.vy;
    d.pulse += 0.08;

    // Check catch with player ship
    if (Math.abs(ship.x - d.x) < ship.halfW + 18 && Math.abs(ship.y - d.y) < ship.halfH + 18) {
      playPowerup();
      if (d.type === 'repair') {
        health = Math.min(MAX_HEALTH, health + 40);
        spawnExplosion(d.x, d.y, 16, '#00ff66');
      } else if (d.type === 'burst') {
        burstTimer = 12.0; // 12 seconds burst fire
        spawnExplosion(d.x, d.y, 22, '#ff44aa');
      } else if (d.type === 'wingman') {
        wingmanTimer = 16.0; // 16 seconds wingmen drones
        spawnExplosion(d.x, d.y, 22, '#00e5ff');
      } else if (d.type === 'life') {
        lives++;
        spawnExplosion(d.x, d.y, 20, '#ff3366');
      }
      drops.splice(i, 1);
      continue;
    }

    if (d.y < -30) drops.splice(i, 1);
  }

  // Asteroids kinematics & collisions
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];
    a.y -= a.vy;

    // Missed asteroid penalty
    if (a.y + a.half < 0) {
      asteroids.splice(i, 1);
      health -= 8;
      if (health <= 0) handleShipHit();
      continue;
    }

    // Bullet vs Asteroid collision
    let destroyed = false;
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.abs(b.x - a.x) < a.half + 4 && Math.abs(b.y - a.y) < a.half + 8) {
        bullets.splice(j, 1);
        destroyed = true;
        score += Math.floor(10 * diffMult());
        spawnExplosion(a.x, a.y, 18, '#ff6a00');

        // 25% chance to drop reward item!
        if (Math.random() < 0.25) {
          spawnDrop(a.x, a.y);
        }
        break;
      }
    }
    if (destroyed) {
      asteroids.splice(i, 1);
      continue;
    }

    // Ship vs Asteroid collision
    if (Math.abs(ship.x - a.x) < (ship.halfW + a.half) * 0.78 &&
        Math.abs(ship.y - a.y) < (ship.halfH + a.half) * 0.78) {
      asteroids.splice(i, 1);
      handleShipHit();
    }
  }

  updateParticles();
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.035;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// Rendering
function render() {
  ctx.fillStyle = '#03040c';
  ctx.fillRect(0, 0, W, H);

  // Invert Y coordinate so 0,0 is at bottom (same as OpenGL coordinate system)
  ctx.save();
  ctx.translate(0, H);
  ctx.scale(1, -1);

  // Stars
  for (const s of stars) {
    ctx.fillStyle = `rgba(255, 255, 255, ${s.b})`;
    ctx.fillRect(s.x, s.y, 2, 2);
  }

  // Reward Drops
  for (const d of drops) {
    renderDrop(d);
  }

  // Bullets
  for (const b of bullets) {
    ctx.strokeStyle = b.color;
    ctx.lineWidth = 3.5;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 9;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x + (b.vx * 1.5), b.y + 16);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // Asteroids (Minecraft 3D blocky voxels)
  for (const a of asteroids) {
    renderMinecraftAsteroid(a);
  }

  // Player Ship & Companion Wingmen
  if (!gameOver) {
    // Shield blinking if invulnerable
    if (invulnerableTimer <= 0 || Math.floor(invulnerableTimer * 10) % 2 === 0) {
      renderPlayerShip(ship.x, ship.y);
    }
    // Shield glow bubble
    if (invulnerableTimer > 0) {
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(ship.x, ship.y, ship.halfH + 12, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // Companion Wingmen Planes
    if (wingmanTimer > 0) {
      renderWingman(ship.x - 44, ship.y - 12);
      renderWingman(ship.x + 44, ship.y - 12);
    }
  }

  // Particles
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1.0;

  ctx.restore();

  // Update HUD
  document.getElementById('hud-score').textContent = `SCORE  ${score}`;
  document.getElementById('hud-lives').innerHTML = `🚀 &times; ${lives}`;
  
  const pBadge = document.getElementById('hud-power');
  if (burstTimer > 0 && wingmanTimer > 0) {
    pBadge.style.display = 'block';
    pBadge.textContent = `BURST + DRONES (${Math.ceil(Math.max(burstTimer, wingmanTimer))}s)`;
    pBadge.style.background = '#ff00aa';
  } else if (burstTimer > 0) {
    pBadge.style.display = 'block';
    pBadge.textContent = `BURST FIRE (${Math.ceil(burstTimer)}s)`;
    pBadge.style.background = '#ff3388';
  } else if (wingmanTimer > 0) {
    pBadge.style.display = 'block';
    pBadge.textContent = `TWIN DRONES (${Math.ceil(wingmanTimer)}s)`;
    pBadge.style.background = '#00ddff';
  } else {
    pBadge.style.display = 'none';
  }

  const hpFill = document.getElementById('hud-fill');
  const hpTxt = document.getElementById('hud-hp');
  hpFill.style.width = `${Math.max(0, health)}%`;
  hpTxt.textContent = `${Math.max(0, health)}%`;

  if (health > 50) {
    hpFill.style.background = '#00ff66';
    hpTxt.style.color = '#00ff66';
  } else if (health > 25) {
    hpFill.style.background = '#ffcc00';
    hpTxt.style.color = '#ffcc00';
  } else {
    hpFill.style.background = '#ff3333';
    hpTxt.style.color = '#ff3333';
  }

  // Game Over Screen
  if (gameOver) {
    ctx.fillStyle = 'rgba(2, 4, 18, 0.88)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff2233';
    ctx.font = 'bold 36px "Segoe UI", Arial';
    ctx.fillText('MISSION FAILED', W / 2, H / 2 - 35);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px "Segoe UI", Arial';
    ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 + 10);

    ctx.fillStyle = '#4ef0ff';
    ctx.font = '16px "Segoe UI", Arial';
    ctx.fillText('Tap screen or Press R to Restart', W / 2, H / 2 + 55);
  }
}

function renderPlayerShip(cx, cy) {
  const hw = ship.halfW;
  const hh = ship.halfH;

  // Animated thruster flame
  const flameLen = 14 * (1.0 + 0.35 * Math.sin(gameTime * 45));
  ctx.fillStyle = '#ff5500';
  ctx.beginPath();
  ctx.moveTo(cx - hw * 0.4, cy - hh);
  ctx.lineTo(cx - hw * 0.15, cy - hh);
  ctx.lineTo(cx - hw * 0.28, cy - hh - flameLen);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx + hw * 0.15, cy - hh);
  ctx.lineTo(cx + hw * 0.4, cy - hh);
  ctx.lineTo(cx + hw * 0.28, cy - hh - flameLen);
  ctx.fill();

  ctx.fillStyle = '#ffea00';
  ctx.beginPath();
  ctx.moveTo(cx - hw * 0.35, cy - hh);
  ctx.lineTo(cx - hw * 0.2, cy - hh);
  ctx.lineTo(cx - hw * 0.28, cy - hh - flameLen * 0.6);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx + hw * 0.2, cy - hh);
  ctx.lineTo(cx + hw * 0.35, cy - hh);
  ctx.lineTo(cx + hw * 0.28, cy - hh - flameLen * 0.6);
  ctx.fill();

  // Swept Wings
  ctx.fillStyle = '#00a8d8';
  ctx.beginPath();
  ctx.moveTo(cx - hw * 0.4, cy);
  ctx.lineTo(cx - hw * 1.35, cy - hh * 0.9);
  ctx.lineTo(cx - hw * 0.3, cy - hh * 0.8);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx + hw * 0.4, cy);
  ctx.lineTo(cx + hw * 1.35, cy - hh * 0.9);
  ctx.lineTo(cx + hw * 0.3, cy - hh * 0.8);
  ctx.fill();

  // Wing beacons
  ctx.fillStyle = '#ff2233';
  ctx.fillRect(cx - hw * 1.35, cy - hh * 0.95, 4, 4);
  ctx.fillStyle = '#00ff66';
  ctx.fillRect(cx + hw * 1.25, cy - hh * 0.95, 4, 4);

  // Twin Laser Cannons
  ctx.fillStyle = '#a0b0d0';
  ctx.fillRect(cx - hw * 0.85, cy - hh * 0.5, 3, hh * 0.75);
  ctx.fillRect(cx + hw * 0.75, cy - hh * 0.5, 3, hh * 0.75);

  // Fuselage
  ctx.fillStyle = '#00e5ff';
  ctx.beginPath();
  ctx.moveTo(cx, cy + hh);
  ctx.lineTo(cx - hw * 0.7, cy - hh);
  ctx.lineTo(cx + hw * 0.7, cy - hh);
  ctx.closePath();
  ctx.fill();

  // Center Ridge
  ctx.fillStyle = '#55f5ff';
  ctx.beginPath();
  ctx.moveTo(cx, cy + hh);
  ctx.lineTo(cx - hw * 0.25, cy - hh * 0.6);
  ctx.lineTo(cx + hw * 0.25, cy - hh * 0.6);
  ctx.closePath();
  ctx.fill();

  // Cockpit Glass
  ctx.fillStyle = '#0a224a';
  ctx.beginPath();
  ctx.moveTo(cx, cy + hh * 0.45);
  ctx.lineTo(cx - hw * 0.25, cy + hh * 0.05);
  ctx.lineTo(cx - hw * 0.2, cy - hh * 0.25);
  ctx.lineTo(cx + hw * 0.2, cy - hh * 0.25);
  ctx.lineTo(cx + hw * 0.25, cy + hh * 0.05);
  ctx.closePath();
  ctx.fill();

  // Cockpit Glare
  ctx.strokeStyle = '#c5f2ff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx - hw * 0.12, cy + hh * 0.35);
  ctx.lineTo(cx - hw * 0.18, cy + hh * 0.05);
  ctx.stroke();

  // Outline
  ctx.strokeStyle = '#80faff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx, cy + hh);
  ctx.lineTo(cx - hw * 0.7, cy - hh);
  ctx.lineTo(cx + hw * 0.7, cy - hh);
  ctx.closePath();
  ctx.stroke();
}

function renderWingman(cx, cy) {
  // Mini companion combat drone
  ctx.fillStyle = '#00c8e6';
  ctx.beginPath();
  ctx.moveTo(cx, cy + 14);
  ctx.lineTo(cx - 10, cy - 10);
  ctx.lineTo(cx + 10, cy - 10);
  ctx.closePath();
  ctx.fill();

  // Drone cockpit
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(cx - 2, cy - 2, 4, 6);

  // Drone thruster
  ctx.fillStyle = '#ff8800';
  ctx.fillRect(cx - 2, cy - 14, 4, 4);
}

function renderDrop(d) {
  const scale = 1.0 + 0.15 * Math.sin(d.pulse);
  ctx.save();
  ctx.translate(d.x, d.y);
  ctx.scale(scale, scale);

  let bgCol = '#00ff66';
  let label = '+HP';

  if (d.type === 'burst') { bgCol = '#ff3388'; label = 'BURST'; }
  else if (d.type === 'wingman') { bgCol = '#00e5ff'; label = 'DRONE'; }
  else if (d.type === 'life') { bgCol = '#ff3366'; label = '+LIFE'; }

  // Glowing orb container
  ctx.fillStyle = 'rgba(10, 20, 40, 0.85)';
  ctx.strokeStyle = bgCol;
  ctx.lineWidth = 2.5;
  ctx.shadowColor = bgCol;
  ctx.shadowBlur = 12;

  ctx.beginPath();
  ctx.arc(0, 0, 16, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Icon / Text
  ctx.save();
  ctx.scale(1, -1); // flip text upright
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 9px "Segoe UI", Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, 0, 1);
  ctx.restore();

  ctx.restore();
}

function renderMinecraftAsteroid(a) {
  const ax = a.x;
  const ay = a.y;
  const h = a.half;
  const s = a.seed;

  const rBase = Math.floor(95 + 40 * s);
  const gBase = Math.floor(48 + 20 * s);
  const bBase = Math.floor(42 + 20 * s);

  // Facet 1: Top-Left (Sunlit)
  ctx.fillStyle = `rgb(${Math.min(255, rBase * 1.45)}, ${Math.min(255, gBase * 1.45)}, ${Math.min(255, bBase * 1.45)})`;
  ctx.beginPath();
  ctx.moveTo(ax - h * 0.7, ay + h);
  ctx.lineTo(ax + h * 0.6, ay + h);
  ctx.lineTo(ax, ay);
  ctx.lineTo(ax - h, ay + h * 0.4);
  ctx.closePath();
  ctx.fill();

  // Facet 2: Top-Right
  ctx.fillStyle = `rgb(${Math.min(255, rBase * 1.15)}, ${Math.min(255, gBase * 1.15)}, ${Math.min(255, bBase * 1.15)})`;
  ctx.beginPath();
  ctx.moveTo(ax + h * 0.6, ay + h);
  ctx.lineTo(ax + h, ay + h * 0.5);
  ctx.lineTo(ax + h * 0.8, ay - h * 0.2);
  ctx.lineTo(ax, ay);
  ctx.closePath();
  ctx.fill();

  // Facet 3: Bottom-Left
  ctx.fillStyle = `rgb(${Math.floor(rBase * 0.85)}, ${Math.floor(gBase * 0.85)}, ${Math.floor(bBase * 0.85)})`;
  ctx.beginPath();
  ctx.moveTo(ax - h, ay + h * 0.4);
  ctx.lineTo(ax, ay);
  ctx.lineTo(ax - h * 0.3, ay - h);
  ctx.lineTo(ax - h * 0.85, ay - h * 0.5);
  ctx.closePath();
  ctx.fill();

  // Facet 4: Bottom-Right (Deep Shadow)
  ctx.fillStyle = `rgb(${Math.floor(rBase * 0.55)}, ${Math.floor(gBase * 0.55)}, ${Math.floor(bBase * 0.55)})`;
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(ax + h * 0.8, ay - h * 0.2);
  ctx.lineTo(ax + h * 0.5, ay - h);
  ctx.lineTo(ax - h * 0.3, ay - h);
  ctx.closePath();
  ctx.fill();

  // Blocky Crater
  const c1x = ax - h * 0.35;
  const c1y = ay + h * 0.25;
  const c1r = h * 0.25;
  ctx.fillStyle = '#22110f';
  ctx.fillRect(c1x - c1r, c1y - c1r, c1r * 2, c1r * 2);
  ctx.strokeStyle = `rgb(${Math.min(255, rBase * 1.5)}, ${Math.min(255, gBase * 1.5)}, ${Math.min(255, bBase * 1.5)})`;
  ctx.lineWidth = 1;
  ctx.strokeRect(c1x - c1r, c1y - c1r, c1r * 2, c1r * 2);

  // Redstone / Magma ore blocks (glowing Minecraft redstone)
  const ore = h * 0.16;
  ctx.fillStyle = '#ff2800';
  ctx.fillRect(ax + h * 0.2 - ore, ay + h * 0.45 - ore, ore * 2, ore * 2);
  ctx.fillRect(ax - h * 0.4 - ore * 0.8, ay - h * 0.25 - ore * 0.8, ore * 1.6, ore * 1.6);

  // Chunky pixelated border outline
  ctx.strokeStyle = '#180d0b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(ax - h * 0.7, ay + h);
  ctx.lineTo(ax + h * 0.6, ay + h);
  ctx.lineTo(ax + h, ay + h * 0.5);
  ctx.lineTo(ax + h * 0.8, ay - h * 0.2);
  ctx.lineTo(ax + h * 0.5, ay - h);
  ctx.lineTo(ax - h * 0.3, ay - h);
  ctx.lineTo(ax - h * 0.85, ay - h * 0.5);
  ctx.lineTo(ax - h, ay + h * 0.4);
  ctx.closePath();
  ctx.stroke();
}

requestAnimationFrame(loop);
</script>
