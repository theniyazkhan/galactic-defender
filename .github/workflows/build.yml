name: Build & Deploy — Galactic Defender WebAssembly

# =============================================================================
#  Triggers: every push to main + manual re-run from the Actions tab
# =============================================================================
on:
  push:
    branches:
      - main
  workflow_dispatch:

# =============================================================================
#  CRITICAL: Grant GITHUB_TOKEN write access so peaceiris/actions-gh-pages
#  can push the compiled output to the gh-pages branch.
#  Without this block, GitHub's default read-only token causes the deploy
#  step to fail with a 403 / "refusing to allow" error.
# =============================================================================
permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Compile C++ → WebAssembly and Deploy to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Step 1 — Checkout source code
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # -----------------------------------------------------------------------
      # Step 2 — Install Emscripten SDK
      # -----------------------------------------------------------------------
      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v12
        with:
          version: latest

      # -----------------------------------------------------------------------
      # Step 3 — Verify Emscripten is on PATH
      # -----------------------------------------------------------------------
      - name: Verify emcc version
        run: emcc --version

      # -----------------------------------------------------------------------
      # Step 4 — Compile main.cpp → WebAssembly
      #
      #   -s USE_FREEGLUT=1        Link the Emscripten FreeGLUT port
      #   -s LEGACY_GL_EMULATION=1 Enable OpenGL 1.x fixed-function pipeline
      #                            (required for glBegin/glEnd/glVertex2f)
      #   -O2                      Optimise (smaller WASM, faster load)
      #   -o public/index.html     Emscripten emits .html + .js + .wasm bundle
      # -----------------------------------------------------------------------
      - name: Compile C++ to WebAssembly
        run: |
          mkdir -p public
          emcc main.cpp \
            -o public/index.html \
            -s USE_FREEGLUT=1 \
            -s LEGACY_GL_EMULATION=1 \
            -O2

      # -----------------------------------------------------------------------
      # Step 5 — Confirm output files exist before deploying
      # -----------------------------------------------------------------------
      - name: Show build artifacts
        run: ls -lh public/

      # -----------------------------------------------------------------------
      # Step 6 — Deploy public/ to gh-pages branch
      #   peaceiris/actions-gh-pages force-pushes public/ to gh-pages.
      #   GitHub Pages must be set to serve from that branch (see README).
      # -----------------------------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          commit_message: "deploy: WebAssembly build from ${{ github.sha }}"