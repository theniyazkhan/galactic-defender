name: Compile C++ to Web
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Emscripten Compiler
        uses: mymindstorm/setup-emsdk@v12
      - name: Compile Game
        run: |
          mkdir public
          emcc main.cpp -o public/index.html -s USE_FREEGLUT=1 -s LEGACY_GL_EMULATION=1
      - name: Deploy Live View
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public